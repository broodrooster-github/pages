name: Generate game index

on:
  push:
    branches:
      - gh-pages
    paths-ignore:
      - index.html

permissions:
  contents: write

concurrency:
  group: generate-game-index
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Generate catalog
        run: python3 scripts/generate_index.py

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- index.html; then
            echo "Catalog is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update generated game index"
          git push
