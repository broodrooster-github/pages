<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Broodrooster Games</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #101317;
      --surface: #191e24;
      --surface-hover: #222a33;
      --border: #303943;
      --text: #f4f7fa;
      --muted: #9ca9b7;
      --accent: #f2b84b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(3rem, 8vw, 7rem) 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 4.75rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .game-count {
      flex: none;
      margin: 0 0 0.3rem;
      color: var(--muted);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 245px), 1fr));
      gap: 1rem;
    }

    .game-card {
      min-width: 0;
      overflow: hidden;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      text-decoration: none;
      transition: border-color 150ms ease, background 150ms ease,
        transform 150ms ease;
    }

    .game-card:hover {
      background: var(--surface-hover);
      border-color: #566575;
      transform: translateY(-3px);
    }

    .game-card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .game-artwork {
      display: grid;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      place-items: center;
      background: #252c35;
      border-bottom: 1px solid var(--border);
    }

    .game-artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-placeholder {
      color: var(--muted);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.08em;
    }

    .game-info {
      display: grid;
      gap: 0.5rem;
      padding: 1rem 1.1rem 1.2rem;
    }

    .game-info strong {
      overflow: hidden;
      font-size: 1.05rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-updated {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.35;
    }

    .game-info > span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 540px) {
      main {
        width: min(100% - 1.25rem, 1120px);
        padding-top: 2.5rem;
      }

      header {
        align-items: start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .game-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Broodrooster</p>
        <h1>Games</h1>
      </div>
      <p class="game-count">4 games</p>
    </header>
    <section class="game-grid" aria-label="Games">
      <a class="game-card" href="./loopomotive/">
        <span class="game-artwork"><img src="./loopomotive/index.icon.png" alt="" loading="lazy"></span>
        <span class="game-info">
          <strong>Loopomotive</strong>
          <time class="game-updated" datetime="2026-09-03T12:51:02+00:00">Updated</time>
          <span>Play in browser <span aria-hidden="true">→</span></span>
        </span>
      </a>
      <a class="game-card" href="./athero/">
        <span class="game-artwork"><img src="./athero/index.icon.png" alt="" loading="lazy"></span>
        <span class="game-info">
          <strong>Athero</strong>
          <time class="game-updated" datetime="2026-09-02T22:24:14+00:00">Updated</time>
          <span>Play in browser <span aria-hidden="true">→</span></span>
        </span>
      </a>
      <a class="game-card" href="./heart-of-the-storm/">
        <span class="game-artwork"><img src="./heart-of-the-storm/index.icon.png" alt="" loading="lazy"></span>
        <span class="game-info">
          <strong>Heart of the Storm</strong>
          <time class="game-updated" datetime="2026-08-23T23:10:12+00:00">Updated</time>
          <span>Play in browser <span aria-hidden="true">→</span></span>
        </span>
      </a>
      <a class="game-card" href="./clockin-it/">
        <span class="game-artwork"><img src="./clockin-it/index.icon.png" alt="" loading="lazy"></span>
        <span class="game-info">
          <strong>Clockin&#x27; It</strong>
          <time class="game-updated" datetime="2026-08-23T21:54:47+00:00">Updated</time>
          <span>Play in browser <span aria-hidden="true">→</span></span>
        </span>
      </a>
    </section>
  </main>

<script>
(function () {
  function plural(count, unit) {
    return count + " " + unit + (count === 1 ? "" : "s");
  }

  function formatAgo(iso) {
    var from = new Date(iso);
    if (Number.isNaN(from.getTime())) return "";

    var to = new Date();
    if (from > to) return "Updated just now";

    var years = to.getFullYear() - from.getFullYear();
    var months = to.getMonth() - from.getMonth();
    var days = to.getDate() - from.getDate();
    var hours = to.getHours() - from.getHours();
    var minutes = to.getMinutes() - from.getMinutes();

    if (minutes < 0) {
      minutes += 60;
      hours -= 1;
    }
    if (hours < 0) {
      hours += 24;
      days -= 1;
    }
    if (days < 0) {
      days += new Date(to.getFullYear(), to.getMonth(), 0).getDate();
      months -= 1;
    }
    if (months < 0) {
      months += 12;
      years -= 1;
    }

    var parts = [];
    if (years) parts.push(plural(years, "year"));
    if (months) parts.push(plural(months, "month"));
    if (days) parts.push(plural(days, "day"));
    if (hours) parts.push(plural(hours, "hour"));
    if (minutes) parts.push(plural(minutes, "minute"));
    if (!parts.length) return "Updated just now";
    return "Updated " + parts.join(", ") + " ago";
  }

  function refresh() {
    document.querySelectorAll("time.game-updated[datetime]").forEach(function (el) {
      var from = new Date(el.dateTime);
      var label = formatAgo(el.dateTime);
      if (label) el.textContent = label;
      if (!Number.isNaN(from.getTime())) el.title = from.toLocaleString();
    });
  }

  refresh();
  setInterval(refresh, 60000);
})();
</script>

</body>
</html>
