<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Broodrooster Games</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #101317;
      --surface: #191e24;
      --surface-hover: #222a33;
      --border: #303943;
      --text: #f4f7fa;
      --muted: #9ca9b7;
      --accent: #f2b84b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(3rem, 8vw, 7rem) 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 4.75rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .game-count {
      flex: none;
      margin: 0 0 0.3rem;
      color: var(--muted);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 245px), 1fr));
      gap: 1rem;
    }

    .game-card {
      min-width: 0;
      overflow: hidden;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      text-decoration: none;
      transition: border-color 150ms ease, background 150ms ease,
        transform 150ms ease;
    }

    .game-card:hover {
      background: var(--surface-hover);
      border-color: #566575;
      transform: translateY(-3px);
    }

    .game-card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .game-artwork {
      display: grid;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      place-items: center;
      background: #252c35;
      border-bottom: 1px solid var(--border);
    }

    .game-artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-placeholder {
      color: var(--muted);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.08em;
    }

    .game-info {
      display: grid;
      gap: 0.5rem;
      padding: 1rem 1.1rem 1.2rem;
    }

    .game-info strong {
      overflow: hidden;
      font-size: 1.05rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-updated {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .game-info > span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 540px) {
      main {
        width: min(100% - 1.25rem, 1120px);
        padding-top: 2.5rem;
      }

      header {
        align-items: start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .game-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Broodrooster</p>
        <h1>Games</h1>
      </div>
      <p class="game-count">4 games</p>
    </header>
    <section class="game-grid" aria-label="Games">
      <a class="game-card" href="./loopomotive/">
        <span class="game-artwork"><img src="./loopomotive/index.icon.png" alt="" loading="lazy"></span>
        <span class="game-info">
          <strong>Loopomotive</strong>
          <time class="game-updated" datetime="2026-08-31T13:12:36+00:00">Updated 31 Aug 2026</time>
          <span>Play in browser <span aria-hidden="true">→</span></span>
        </span>
      </a>
      <a class="game-card" href="./athero/">
        <span class="game-artwork"><img src="./athero/index.icon.png" alt="" loading="lazy"></span>
        <span class="game-info">
          <strong>Athero</strong>
          <time class="game-updated" datetime="2026-08-31T10:14:47+00:00">Updated 31 Aug 2026</time>
          <span>Play in browser <span aria-hidden="true">→</span></span>
        </span>
      </a>
      <a class="game-card" href="./heart-of-the-storm/">
        <span class="game-artwork"><img src="./heart-of-the-storm/index.icon.png" alt="" loading="lazy"></span>
        <span class="game-info">
          <strong>Heart of the Storm</strong>
          <time class="game-updated" datetime="2026-08-23T23:10:12+00:00">Updated 23 Aug 2026</time>
          <span>Play in browser <span aria-hidden="true">→</span></span>
        </span>
      </a>
      <a class="game-card" href="./clockin-it/">
        <span class="game-artwork"><img src="./clockin-it/index.icon.png" alt="" loading="lazy"></span>
        <span class="game-info">
          <strong>Clockin&#x27; It</strong>
          <time class="game-updated" datetime="2026-08-23T21:54:47+00:00">Updated 23 Aug 2026</time>
          <span>Play in browser <span aria-hidden="true">→</span></span>
        </span>
      </a>
    </section>
  </main>
</body>
</html>
